# Raiju client (connects to the server).
# Run: sudo ./build/mini-vpn config/client.conf

mode = client
peer_addr = 192.168.1.10   # the server's real IP address (change this)
peer_port = 51820          # must match the server's listen_port

tun_addr = 10.8.0.2        # this side's address inside the tunnel
tun_prefix = 24
mtu = 1400

# Shared secret: must be identical on both sides.
# Generate one with:  openssl rand -hex 32
psk = REPLACE_WITH_64_HEX_CHARS
