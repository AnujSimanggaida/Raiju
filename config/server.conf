# Raiju server (the side with the fixed, reachable address).
# Run: sudo ./build/mini-vpn config/server.conf

mode = server
listen_port = 51820     # UDP port clients connect to

tun_addr = 10.8.0.1     # this side's address inside the tunnel
tun_prefix = 24
mtu = 1400              # 1500 minus room for Raiju + UDP + IP headers

# Shared secret: must be identical on both sides.
# Generate one with:  openssl rand -hex 32
psk = 3ef8529f150b106bbc6f893f5759fe84a12204c642cea22c81a8fd3765cedb2f
REPLACE_WITH_64_HEX_CHARS
